# One free web service. No database, disk, worker, cron or paid add-ons.
services:
  - type: web
    name: cyberpulse-dashboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
